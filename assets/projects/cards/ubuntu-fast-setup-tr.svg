<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 224" width="1200" height="224" role="img" aria-label="08. Ubuntu Fast Setup — Ubuntu kurulumundan sonra sürücüleri, geliştirme araçlarını ve masaüstü uygulamalarını otomatik hazırlayan açık kaynak kurulum paketi." preserveAspectRatio="xMidYMid meet">
  <title>08. Ubuntu Fast Setup — Ubuntu kurulumundan sonra sürücüleri, geliştirme araçlarını ve masaüstü uygulamalarını otomatik hazırlayan açık kaynak kurulum paketi.</title>
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" width="1200" height="234" role="img" aria-label="02. ILGEAI Website — A multilingual corporate web platform with product pages, an admin panel, and a secure backend architecture." preserveAspectRatio="xMidYMid meet">
  <title>02. ILGEAI Website — A multilingual corporate web platform with product pages, an admin panel, and a secure backend architecture.</title>
  <defs>
    <linearGradient id="pcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222C29"/>
      <stop offset="100%" stop-color="#1B2422"/>
    </linearGradient>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111518"/>
      <stop offset="100%" stop-color="#171D1C"/>
    </linearGradient>
    <pattern id="pgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2D3B37" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .f{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Liberation Sans",sans-serif}
    .m{font-family:"IBM Plex Mono","Consolas","DejaVu Sans Mono",monospace}
    .num{font-size:13.5px;font-weight:700;letter-spacing:.5px;fill:#D4B477}
    .name{font-size:23px;font-weight:700;fill:#F1EEE7}
    .body{font-size:15.5px;font-weight:400;fill:#C4CCC7}
    .techlbl{font-size:12.5px;font-weight:600;letter-spacing:.1px;fill:#C4CCC7}
    .cat{font-size:11.5px;font-weight:700;letter-spacing:.8px;fill:#78BBA9}
    .maintag{font-size:10.5px;font-weight:700;letter-spacing:.6px;fill:#D4B477}
    .pill{font-size:13px;font-weight:700;letter-spacing:.4px}
    .link{font-size:15.5px;font-weight:700;letter-spacing:.1px}
    .priv{font-size:14px;font-weight:500;fill:#93A099}
    .sec{font-size:11px;font-weight:700;letter-spacing:.4px;fill:#D4B477}
    .ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .glow{animation:cglow 9s ease-in-out infinite;animation-delay:-1.90s}
    @keyframes cglow{0%,100%{stroke:#40534D;opacity:.9}50%{stroke:#4FA78F;opacity:1}}
    .arrow{animation:arrow 3.6s ease-in-out infinite;animation-delay:-1.14s}
    @keyframes arrow{0%%,100%%{transform:translateX(0)}50%%{transform:translateX(3px)}}
    .lockpulse{animation:lockp 6s ease-in-out infinite;animation-delay:-1.90s}
    @keyframes lockp{0%%,100%%{opacity:.75}50%%{opacity:1}}
    .mainglow{animation:mglow 7s ease-in-out infinite;animation-delay:-1.90s}
    @keyframes mglow{0%%,100%%{opacity:.6}50%%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .glow,.arrow,.lockpulse,.mainglow{animation:none}
    }
  </style>
  <rect width="1200" height="234" fill="#171D1C"/>
  <rect width="1200" height="234" fill="url(#pbg)"/>
  <rect width="1200" height="234" fill="url(#pgrid)" opacity=".4"/>

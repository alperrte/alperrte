oke="#B4121B"><title>SQLAlchemy</title><ellipse cx="12" cy="6" rx="7.6" ry="2.8"/><path d="M4.4 6v12c0 1.5 3.4 2.8 7.6 2.8s7.6-1.3 7.6-2.8V6"/><path d="M4.4 12c0 1.5 3.4 2.8 7.6 2.8s7.6-1.3 7.6-2.8" stroke-width="1.5"/></g><text class="techlbl" x="616" y="151">SQLAlchemy</text>
    <g class="mainglow"><rect x="1075" y="20" width="103" height="19" rx="9.5" fill="none" stroke="#D4B477" stroke-width="1"/><text class="maintag" x="1126.5" y="33.5" text-anchor="middle">MAIN PROJECT</text></g><text class="m cat" x="1178" y="57" text-anchor="end">CORPORATE WEB PLATFORM</text><rect x="983" y="72" width="195" height="29" rx="14.5" fill="url(#pcard)" stroke="#D4B477" stroke-width="1.1"/><g class="ico" transform="translate(992 76.5) scale(0.72)" color="#D4B477"><rect x="4.4" y="10.4" width="15.2" height="10.4" rx="2.2"/><path d="M7.6 10.4V7.6a4.4 4.4 0 0 1 8.8 0v2.8"/><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/></g><text class="pill" x="1014" y="91.5" fill="#D4B477">PRIVATE SOURCE CODE</text>
    <text class="link m" x="1001" y="215.0" fill="#78BBA9">View Live Website →</text>
    <g class="arrow ico" stroke="#78BBA9" transform="translate(1159 198.0) scale(0.88)"><path d="M4 12h14M12 6l6 6-6 6"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-label="Öne Çıkan Projeler">
  <title>Öne Çıkan Projeler</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111518"/><stop offset="100%" stop-color="#171D1C"/></linearGradient>
    <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4FA78F" stop-opacity="0.75"/><stop offset="16%" stop-color="#D4B477" stop-opacity="0.55"/><stop offset="45%" stop-color="#40534D" stop-opacity="0.55"/><stop offset="100%" stop-color="#40534D" stop-opacity="0"/></linearGradient>
    <linearGradient id="haccent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4FA78F"/><stop offset="70%" stop-color="#4FA78F"/><stop offset="100%" stop-color="#D4B477"/></linearGradient>
    <pattern id="hgrid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#2D3B37" stroke-width="1" opacity="0.3"/></pattern>
  </defs>
  <rect width="1200" height="88" fill="#111518"/>
  <rect width="1200" height="88" fill="url(#hbg)"/>
  <rect width="1200" height="88" fill="url(#hgrid)" opacity=".35"/>
  <g class="f" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, Noto Sans, Liberation Sans, sans-serif">
    <rect x="64" y="22" width="4" height="40" rx="2" fill="url(#haccent)"/>
    <text x="80" y="40" font-size="33" font-weight="700" letter-spacing=".2px" fill="#F1EEE7">Öne Çıkan Projeler</text>
    <text x="80" y="64" font-size="15.5" fill="#C4CCC7">Ürün geliştirme, yapay zekâ, otomasyon ve yazılım mimarisi alanındaki seçili çalışmalarım.</text>
    <rect x="64" y="78" width="1072" height="1.2" fill="url(#hrule)"/>
    <g stroke="#78BBA9" stroke-width="1.4" fill="none" stroke-linejoin="round"><rect x="1066" y="42" width="6.4" height="6.4" rx="1"/><rect x="1075.4" y="42" width="6.4" height="6.4" rx="1"/><rect x="1066" y="51" width="6.4" height="6.4" rx="1"/><rect x="1075.4" y="51" width="6.4" height="6.4" rx="1"/></g>
    <text x="1086" y="57" font-family="IBM Plex Mono, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="700" letter-spacing="1px" fill="#93A099">08 PROJE</text>
  </g>
</svg>

    .arrow{animation:arrow 3.6s ease-in-out infinite;animation-delay:-0.00s}
    @keyframes arrow{0%%,100%%{transform:translateX(0)}50%%{transform:translateX(3px)}}
    .lockpulse{animation:lockp 6s ease-in-out infinite;animation-delay:-0.00s}
    @keyframes lockp{0%%,100%%{opacity:.75}50%%{opacity:1}}
    .mainglow{animation:mglow 7s ease-in-out infinite;animation-delay:-0.00s}
    @keyframes mglow{0%%,100%%{opacity:.6}50%%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .glow,.arrow,.lockpulse,.mainglow{animation:none}
    }
  </style>
